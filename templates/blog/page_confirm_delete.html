{% extends "blog/base.html" %}

{% block title %}Eliminar página{% endblock %}

{% block content %}
    <h2>¿Eliminar "{{ object.titulo }}"?</h2>
    <p>Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar eliminación</button>
        <a href="{% url 'page_detail' object.pk %}" class="btn btn-secondary">Cancelar</a>
    </form>
{% endblock %}
