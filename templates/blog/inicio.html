{% extends "blog/base.html" %}

{% block title %}Inicio{% endblock %}

{% block content %}
    <h2>Inicio</h2>
    <p>Bienvenido al blog.</p>
    <p><a href="{% url 'page_list' %}">Ver páginas</a> · <a href="{% url 'about' %}">Acerca de</a></p>
    {% if user.is_authenticated %}
        <p><a href="{% url 'page_create' %}" class="btn">Crear página</a></p>
    {% else %}
        <p><a href="{% url 'login' %}">Login</a> · <a href="{% url 'signup' %}">Signup</a></p>
    {% endif %}
{% endblock %}
